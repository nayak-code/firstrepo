# This workflow will build java project with Gradle

name: Java CI project with Gradle

on: 
 push: 
   branches: [ master ]
 pull_request:
   branches: [ master ]

jobs:
  build-java:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8

      - name: Grant execution permission to Gradlew
        run: chmod +x gradlew

      - name: Build with gradle
        run: ./gradlew build








        
